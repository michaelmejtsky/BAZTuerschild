<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAZ Türschild</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   NORMALES DISPONENTENBILD
   ========================================================= */

#schild {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  object-fit: fill;

  display: block;

  z-index: 1;
}


/* =========================================================
   ELKOS STATUSANZEIGE
   ========================================================= */

#statusOverlay {
  position: fixed;
  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;
  flex-direction: column;

  text-align: center;

  box-sizing: border-box;

  padding: 4vw;

  z-index: 50;
}


/* =========================================================
   GELB
   NOTRUFGESPRÄCH
   ========================================================= */

#statusOverlay.call {
  display: flex;

  background: #f5c400;

  color: #000;
}


/* =========================================================
   ROT
   BESETZT
   ========================================================= */

#statusOverlay.busy {
  display: flex;

  background: #b00020;

  color: #fff;
}


#statusTitle {
  font-size: 6vw;

  font-weight: 900;

  line-height: 1.05;

  text-transform: uppercase;

  max-width: 92%;
}


#statusSubtitle {
  margin-top: 3vw;

  font-size: 3.2vw;

  font-weight: 700;

  line-height: 1.2;

  max-width: 85%;
}


#statusWappen {
  position: absolute;

  right: 5vw;
  bottom: 5vh;

  width: 13vw;

  max-width: 190px;

  opacity: 0.95;
}


/* =========================================================
   BESTEHENDER VERBINDUNGS-FALLBACK
   ========================================================= */

#meldung {
  position: fixed;
  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  background: #000;

  color: #fff;

  text-align: center;

  font-size: 2.4vw;

  padding: 40px;

  box-sizing: border-box;

  z-index: 100;
}


#meldungText {
  max-width: 65%;

  line-height: 1.35;
}


#wappen {
  position: fixed;

  right: 6%;
  top: 50%;

  transform: translateY(-50%);

  width: 190px;

  max-width: 18vw;

  z-index: 110;

  opacity: 0.95;
}


/* =========================================================
   DEBUG
   ========================================================= */

#debugPanel {
  position: fixed;

  left: 14px;
  bottom: 14px;

  display: none;

  max-width: 720px;

  background: rgba(0, 0, 0, 0.85);

  color: #00eaff;

  border: 1px solid rgba(0, 234, 255, 0.55);

  border-radius: 12px;

  padding: 12px 14px;

  box-sizing: border-box;

  z-index: 99999;

  font-size: 13px;

  line-height: 1.45;

  text-align: left;

  font-family: Consolas, monospace;

  word-break: break-word;
}

</style>
</head>


<body>


<!-- ======================================================
     NORMALES DISPONENTENBILD
     ====================================================== -->

<img
  id="schild"
  alt="BAZ Türschild"
>


<!-- ======================================================
     ELKOS STATUS
     ====================================================== -->

<div id="statusOverlay">

  <div id="statusTitle"></div>

  <div id="statusSubtitle"></div>

  <img
    id="statusWappen"
    src="https://lh3.googleusercontent.com/d/1sRhX6ARI0fulpRUnoVScMUb3QL3B2ivO"
    alt="Wappen"
  >

</div>


<!-- ======================================================
     VERBINDUNGSFALLBACK
     ====================================================== -->

<div id="meldung">

  <div id="meldungText">

    Derzeit gibt es Verbindungsschwierigkeiten.<br>

    Wir arbeiten an der Problembehebung.<br><br>

    Bitte läuten Sie einfach an.

  </div>

  <img
    id="wappen"
    src="https://lh3.googleusercontent.com/d/1sRhX6ARI0fulpRUnoVScMUb3QL3B2ivO"
    alt="Wappen"
  >

</div>


<!-- ======================================================
     DEBUG
     ====================================================== -->

<div id="debugPanel">
  Statusdiagnose wird geladen …
</div>



<script>


/* =========================================================
   KONFIGURATION
   ========================================================= */


/*
 * DEIN BESTEHENDES APPS SCRIPT
 */

var SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx7iycjDS2MtYA1sTFPiqHs2XV3G0JBlKUxfysi2UBZoVaKuNJGMM7gOAnFexj7Bssq/exec";


/*
 * DEIN BESTEHENDER GLOBALER FALLBACK
 */

var GLOBAL_STATUS_URL =
  "https://michaelmejtsky.github.io/FFSTP-Status/status.json";


/*
 * Normales Türschild:
 * alle 30 Sekunden
 */

var NORMAL_UPDATE_INTERVAL =
  30000;


/*
 * Wenn ELKOS aktiv ist:
 * Status alle 5 Sekunden
 *
 * Solange ELKOS deaktiviert ist,
 * wird dieser Timer NICHT gestartet.
 */

var ELKOS_UPDATE_INTERVAL =
  5000;


/*
 * Verbindungsausfall:
 * Erst nach 5 Minuten ohne gültige
 * ELKOS-/Backend-Daten wird der Fallback angezeigt.
 */

var CONNECTION_FALLBACK_MS =
  5 * 60 * 1000;



/* =========================================================
   ELEMENTE
   ========================================================= */

var img =
  document.getElementById("schild");


var meldung =
  document.getElementById("meldung");


var statusOverlay =
  document.getElementById("statusOverlay");


var statusTitle =
  document.getElementById("statusTitle");


var statusSubtitle =
  document.getElementById("statusSubtitle");


var debugPanel =
  document.getElementById("debugPanel");



/* =========================================================
   STATUSVARIABLEN
   ========================================================= */

var currentUrl =
  "";


var lastSuccess =
  Date.now();


/*
 * Letzte gültige ELKOS-Antwort.
 */

var lastElkosSuccess =
  Date.now();


/*
 * Letzter bekannter Disponent.
 * Zusätzlich im Browser gespeichert,
 * damit der Name auch nach einem Reload
 * noch zur Verfügung steht.
 */

var lastKnownDisponentName =
  "";

try {
  lastKnownDisponentName =
    localStorage.getItem(
      "bazLastKnownDisponentName"
    ) || "";
} catch (e) {}


var globalFallbackActive =
  false;


var localFallbackActive =
  false;


var elkosEnabled =
  false;


var currentBazStatus =
  "DISABLED";


var elkosTimer =
  null;


var debugMode =
  false;


/*
 * Optionaler UI-Testmodus.
 *
 * Dadurch können wir Gelb/Rot testen,
 * OHNE ELKOS zu aktivieren.
 */

var uiTestMode =
  "";



/* =========================================================
   URL PARAMETER
   ========================================================= */

var params =
  new URLSearchParams(
    window.location.search
  );


/*
 * Debug:
 *
 * ?debug=1
 */

if (
  params.has("debug") ||
  params.get("debug") === "1"
) {

  debugMode =
    true;

  debugPanel.style.display =
    "block";
}


/*
 * UI Test:
 *
 * ?test=call
 * ?test=busy
 * ?test=normal
 */

var requestedTest =
  String(
    params.get("test") || ""
  ).toLowerCase();


if (
  requestedTest === "call" ||
  requestedTest === "busy" ||
  requestedTest === "normal"
) {

  uiTestMode =
    requestedTest;
}



/* =========================================================
   FALLBACK
   ========================================================= */

function showFallback() {

  var meldungText =
    document.getElementById(
      "meldungText"
    );

  var nameText =
    lastKnownDisponentName
      ? lastKnownDisponentName
      : "derzeit nicht verfügbar";

  meldungText.innerHTML =
    "Derzeit gibt es Verbindungsschwierigkeiten.<br>" +
    "Der ELKOS-Status kann momentan nicht aktualisiert werden.<br><br>" +
    "<strong>Diensthabender Disponent:</strong><br>" +
    "<span style='font-size:1.4em;font-weight:700;'>" +
    nameText +
    "</span><br><br>" +
    "Bitte läuten Sie einfach an.";

  meldung.style.display =
    "flex";
}


function hideFallback() {

  if (
    globalFallbackActive ||
    localFallbackActive
  ) {

    return;
  }


  meldung.style.display =
    "none";
}



/* =========================================================
   DEBUG
   ========================================================= */

function setDebug(text) {

  if (!debugMode) {

    return;
  }


  debugPanel.style.display =
    "block";


  debugPanel.innerHTML =
    text;
}



/* =========================================================
   STATUS OVERLAY AUS
   ========================================================= */

function hideStatusOverlay() {

  statusOverlay.className =
    "";


  statusOverlay.style.display =
    "none";


  statusTitle.innerHTML =
    "";


  statusSubtitle.innerHTML =
    "";
}



/* =========================================================
   GELB
   ========================================================= */

function showCallStatus() {

  statusOverlay.className =
    "call";


  statusOverlay.style.display =
    "flex";


  statusTitle.innerHTML =
    "DISPONENT<br>IM NOTRUFGESPRÄCH";


  statusSubtitle.innerHTML =
    "BITTE WARTEN";
}



/* =========================================================
   ROT
   ========================================================= */

function showBusyStatus() {

  statusOverlay.className =
    "busy";


  statusOverlay.style.display =
    "flex";


  statusTitle.innerHTML =
    "DISPONENT KURZ ABWESEND";


  statusSubtitle.innerHTML =
    "BITTE WARTEN";
}



/* =========================================================
   OPTIONALER UI TEST
   ========================================================= */

function applyUiTestMode() {

  if (
    uiTestMode === "call"
  ) {

    showCallStatus();

    return true;
  }


  if (
    uiTestMode === "busy"
  ) {

    showBusyStatus();

    return true;
  }


  if (
    uiTestMode === "normal"
  ) {

    hideStatusOverlay();

    return true;
  }


  return false;
}



/* =========================================================
   ELKOS STATUS AUSWERTEN
   ========================================================= */

function applyBazStatus(data) {


  /*
   * UI-Test hat Vorrang.
   *
   * Dabei wird NUR die Darstellung getestet.
   */

  if (
    applyUiTestMode()
  ) {

    return;
  }


  /*
   * Apps-Script-Schalter übernehmen
   */

  elkosEnabled =
    !!(
      data &&
      data.bazStatusEnabled === true
    );


  currentBazStatus =
    data &&
    data.bazStatus
      ? String(
          data.bazStatus
        ).toUpperCase()
      : "UNKNOWN";


  /*
   * ELKOS AUS
   *
   * normales Türschild
   * keine Ausfallüberwachung
   */

  if (!elkosEnabled) {

    lastElkosSuccess =
      Date.now();

    localFallbackActive =
      false;

    hideFallback();

    hideStatusOverlay();

    stopFastElkosPolling();

    return;
  }


  /*
   * ELKOS EIN
   */

  startFastElkosPolling();


  /*
   * Gültiger ELKOS-Status.
   *
   * NORMAL / CALL / BUSY / OFFLINE
   * gelten als erfolgreiche Statusantwort.
   */

  if (
    data.bazStatusOk === true &&
    currentBazStatus !== "UNKNOWN"
  ) {

    lastElkosSuccess =
      Date.now();

    localFallbackActive =
      false;

    hideFallback();

  } else {

    /*
     * ELKOS liefert derzeit keine gültigen Daten.
     * Erst nach 5 Minuten wird der Fallback gezeigt.
     */

    checkFallback();

    /*
     * Solange die 5 Minuten noch nicht erreicht sind,
     * bleibt das zuletzt angezeigte Türschild bestehen.
     */

    if (
      Date.now() - lastElkosSuccess <
      CONNECTION_FALLBACK_MS
    ) {

      return;
    }
  }


  /*
   * CALL
   *
   * BESCHAEFTIGT
   */

  if (
    currentBazStatus === "CALL" &&
    data.bazStatusOk === true
  ) {

    showCallStatus();

    return;
  }


  /*
   * BUSY
   *
   * PAUSE und niemand verfügbar
   */

  if (
    currentBazStatus === "BUSY" &&
    data.bazStatusOk === true
  ) {

    showBusyStatus();

    return;
  }


  /*
   * NORMAL
   * OFFLINE
   *
   * -> normales Disponentenbild
   */

  if (
    currentBazStatus === "NORMAL" ||
    currentBazStatus === "OFFLINE"
  ) {

    hideStatusOverlay();
  }
}



/* =========================================================
   META ÜBER JSONP HOLEN
   ========================================================= */

function requestMeta(
  callbackFunction
) {

  var cb =
    "cb_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  var responded =
    false;


  var script =
    null;


  window[cb] =
    function(data) {


      responded =
        true;


      /*
       * Gültige Antwort
       */

      if (
        data &&
        data.ok &&
        data.url
      ) {


        lastSuccess =
          Date.now();


        /*
         * Letzten bekannten Disponenten merken.
         */

        if (
          data.name
        ) {

          lastKnownDisponentName =
            String(
              data.name
            );

          try {
            localStorage.setItem(
              "bazLastKnownDisponentName",
              lastKnownDisponentName
            );
          } catch (e) {}
        }


        /*
         * Disponentenbild
         */

        if (
          data.url !==
          currentUrl
        ) {


          currentUrl =
            data.url;


          img.src =
            currentUrl +

            (
              currentUrl.indexOf("?") >= 0
                ? "&"
                : "?"
            ) +

            "r=" +
            Date.now();
        }


        /*
         * ELKOS
         */

        applyBazStatus(
          data
        );


        /*
         * DEBUG
         */

        if (debugMode) {


          var aps =
            data.bazArbeitsplaetze ||
            [];


          var apText =
            aps.map(
              function(ap) {

                return (

                  (ap.arbeitsplatzName || "?") +

                  " | " +

                  (ap.disponentName || "-") +

                  " | " +

                  (ap.verfuegbarkeit || "?")
                );
              }
            )
            .join("<br>");


          setDebug(

            "<b>BAZ Türschild</b>" +

            "<br><br>Disponent: " +
            (
              data.name ||
              "-"
            ) +

            "<br>ELKOS aktiviert: " +
            String(
              data.bazStatusEnabled
            ) +

            "<br>BAZ Status: " +
            (
              data.bazStatus ||
              "-"
            ) +

            "<br>BAZ Status OK: " +
            String(
              data.bazStatusOk
            ) +

            "<br>BAZ Meldung: " +
            (
              data.bazStatusMessage ||
              "-"
            ) +

            "<br>UI Test: " +
            (
              uiTestMode ||
              "aus"
            ) +

            "<br><br><b>Arbeitsplätze St. Pölten</b><br>" +

            (
              apText ||
              "keine Daten"
            )
          );
        }


      } else {

        checkFallback();
      }


      /*
       * Callback entfernen
       */

      try {

        delete window[cb];

      } catch (e) {}


      /*
       * Script entfernen
       */

      if (
        script &&
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );
      }


      if (
        typeof callbackFunction ===
        "function"
      ) {

        callbackFunction(
          data
        );
      }
    };


  /*
   * JSONP Script
   */

  script =
    document.createElement(
      "script"
    );


  script.src =

    SCRIPT_URL +

    "?meta=1" +

    "&callback=" +
    encodeURIComponent(cb) +

    "&t=" +
    Date.now();


  document.body
    .appendChild(
      script
    );


  /*
   * Timeout
   */

  setTimeout(
    function() {


      if (!responded) {

        checkFallback();
      }


      if (
        script &&
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );
      }


      try {

        if (!responded) {

          delete window[cb];
        }

      } catch (e) {}


    },
    8000
  );
}



/* =========================================================
   NORMALES UPDATE
   ========================================================= */

function update() {


  if (
    globalFallbackActive
  ) {

    showFallback();

    return;
  }


  requestMeta();
}



/* =========================================================
   SCHNELLES ELKOS UPDATE
   ========================================================= */

function elkosUpdate() {


  if (
    !elkosEnabled
  ) {

    return;
  }


  if (
    globalFallbackActive
  ) {

    return;
  }


  requestMeta();
}



/* =========================================================
   ELKOS TIMER START
   ========================================================= */

function startFastElkosPolling() {


  if (
    elkosTimer !== null
  ) {

    return;
  }


  elkosTimer =
    setInterval(

      elkosUpdate,

      ELKOS_UPDATE_INTERVAL
    );
}



/* =========================================================
   ELKOS TIMER STOP
   ========================================================= */

function stopFastElkosPolling() {


  if (
    elkosTimer === null
  ) {

    return;
  }


  clearInterval(
    elkosTimer
  );


  elkosTimer =
    null;
}



/* =========================================================
   LOKALER FALLBACK
   ========================================================= */

function checkFallback() {


  var now =
    Date.now();


  var backendDiff =
    now -
    lastSuccess;


  var elkosDiff =
    now -
    lastElkosSuccess;


  /*
   * Backend selbst länger als 5 Minuten
   * ohne gültige Antwort.
   */

  var backendLost =
    backendDiff >=
    CONNECTION_FALLBACK_MS;


  /*
   * ELKOS ist aktiviert, liefert aber
   * länger als 5 Minuten keine gültigen Daten.
   */

  var elkosLost =
    elkosEnabled &&
    elkosDiff >=
      CONNECTION_FALLBACK_MS;


  if (
    backendLost ||
    elkosLost
  ) {

    localFallbackActive =
      true;

    showFallback();

    return;
  }


  /*
   * Noch innerhalb der 5-Minuten-Toleranz:
   * keine Verbindungsausfallanzeige.
   */

  localFallbackActive =
    false;

  hideFallback();
}



/* =========================================================
   BILDFEHLER
   ========================================================= */

img.onerror =
  function() {

    /*
     * Ein einzelner Bildfehler löst nicht sofort
     * den Verbindungsausfall aus.
     * Die normale 5-Minuten-Überwachung entscheidet.
     */

    checkFallback();
  };



/* =========================================================
   GLOBALER FALLBACK
   ========================================================= */

async function checkGlobalFallbackStatus() {


  var url =

    GLOBAL_STATUS_URL +

    "?nocache=" +

    Date.now();


  try {


    var response =
      await fetch(

        url,

        {
          cache:
            "no-store"
        }
      );


    var text =
      await response.text();


    var lower =
      text.toLowerCase();


    var fallbackIsTrue =

      lower.includes(
        "fallback"
      )

      &&

      lower.includes(
        "true"
      );


    if (
      fallbackIsTrue
    ) {


      globalFallbackActive =
        true;


      showFallback();


    } else {


      globalFallbackActive =
        false;


      hideFallback();
    }


  } catch (err) {


    /*
     * Wenn nur die globale Statusdatei
     * gerade nicht erreichbar ist,
     * zerstören wir das Türschild nicht.
     */


    if (debugMode) {

      setDebug(

        "Globaler Status konnte nicht geprüft werden:<br>" +

        String(err)
      );
    }


    console.log(

      "Globaler Status konnte nicht geprüft werden:",

      err
    );
  }
}



/* =========================================================
   BESTEHENDER OFFLINE-TEST
   ========================================================= */

if (

  params.has("offline")

  ||

  params.has("testoffline")

  ||

  params.get("test") === "offline"

) {


  globalFallbackActive =
    true;


  showFallback();
}



/* =========================================================
   START
   ========================================================= */

hideStatusOverlay();


/*
 * Falls UI Test aktiv:
 * sofort anzeigen.
 */

applyUiTestMode();


/*
 * normales Türschild laden
 */

update();


/*
 * globalen Status prüfen
 */

checkGlobalFallbackStatus();



/* =========================================================
   TIMER
   ========================================================= */


/*
 * normales Türschild
 *
 * 30 Sekunden wie bisher
 */

setInterval(

  update,

  NORMAL_UPDATE_INTERVAL
);


/*
 * globaler Fallback
 *
 * 10 Sekunden wie bisher
 */

setInterval(

  checkGlobalFallbackStatus,

  10000
);


</script>

</body>
</html>
