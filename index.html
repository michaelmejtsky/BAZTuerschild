<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAZ Türschild</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   NORMALES DISPONENTENBILD
   ========================================================= */

#schild {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  object-fit: fill;

  display: block;

  z-index: 1;
}


/* =========================================================
   ELKOS STATUSANZEIGE
   ========================================================= */

#statusOverlay {
  position: fixed;
  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;
  flex-direction: column;

  text-align: center;

  box-sizing: border-box;

  padding: 4vw;

  z-index: 50;
}


/* =========================================================
   GELB
   NOTRUFGESPRÄCH
   ========================================================= */

#statusOverlay.call {
  display: flex;

  background: #f5c400;

  color: #000;
}


/* =========================================================
   ROT
   BESETZT
   ========================================================= */

#statusOverlay.busy {
  display: flex;

  background: #b00020;

  color: #fff;
}


#statusTitle {
  font-size: 6vw;

  font-weight: 900;

  line-height: 1.05;

  text-transform: uppercase;

  max-width: 92%;
}


#statusSubtitle {
  margin-top: 3vw;

  font-size: 3.2vw;

  font-weight: 700;

  line-height: 1.2;

  max-width: 85%;
}


#statusWappen {
  position: absolute;

  right: 5vw;
  bottom: 5vh;

  width: 13vw;

  max-width: 190px;

  opacity: 0.95;
}


/* =========================================================
   BESTEHENDER VERBINDUNGS-FALLBACK
   ========================================================= */

#meldung {
  position: fixed;
  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  background: #000;

  color: #fff;

  text-align: center;

  font-size: 2.4vw;

  padding: 40px;

  box-sizing: border-box;

  z-index: 100;
}


#meldungText {
  max-width: 65%;

  line-height: 1.35;
}


#wappen {
  position: fixed;

  right: 6%;
  top: 50%;

  transform: translateY(-50%);

  width: 190px;

  max-width: 18vw;

  z-index: 110;

  opacity: 0.95;
}


/* =========================================================
   DEBUG
   ========================================================= */

#debugPanel {
  position: fixed;

  left: 14px;
  bottom: 14px;

  display: none;

  max-width: 720px;

  background: rgba(0, 0, 0, 0.85);

  color: #00eaff;

  border: 1px solid rgba(0, 234, 255, 0.55);

  border-radius: 12px;

  padding: 12px 14px;

  box-sizing: border-box;

  z-index: 99999;

  font-size: 13px;

  line-height: 1.45;

  text-align: left;

  font-family: Consolas, monospace;

  word-break: break-word;
}

</style>
</head>


<body>


<!-- ======================================================
     NORMALES DISPONENTENBILD
     ====================================================== -->

<img
  id="schild"
  alt="BAZ Türschild"
>


<!-- ======================================================
     ELKOS STATUS
     ====================================================== -->

<div id="statusOverlay">

  <div id="statusTitle"></div>

  <div id="statusSubtitle"></div>

  <img
    id="statusWappen"
    src="https://lh3.googleusercontent.com/d/1sRhX6ARI0fulpRUnoVScMUb3QL3B2ivO"
    alt="Wappen"
  >

</div>


<!-- ======================================================
     VERBINDUNGSFALLBACK
     ====================================================== -->

<div id="meldung">

  <div id="meldungText">

    Derzeit gibt es Verbindungsschwierigkeiten.<br>

    Wir arbeiten an der Problembehebung.<br><br>

    Bitte läuten Sie einfach an.

  </div>

  <img
    id="wappen"
    src="https://lh3.googleusercontent.com/d/1sRhX6ARI0fulpRUnoVScMUb3QL3B2ivO"
    alt="Wappen"
  >

</div>


<!-- ======================================================
     DEBUG
     ====================================================== -->

<div id="debugPanel">
  Statusdiagnose wird geladen …
</div>



<script>

/* =========================================================
   KONFIGURATION
   ========================================================= */

var SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx7iycjDS2MtYA1sTFPiqHs2XV3G0JBlKUxfysi2UBZoVaKuNJGMM7gOAnFexj7Bssq/exec";

var GLOBAL_STATUS_URL =
  "https://michaelmejtsky.github.io/FFSTP-Status/status.json";


/*
 * Disponentenbild / Name:
 * alle 15 Sekunden. Der Disponent wechselt selten,
 * aber ein Schichtwechsel soll trotzdem rasch sichtbar sein.
 */
var META_UPDATE_INTERVAL =
  15000;


/*
 * Snapshot lesen:
 * nur als Sicherheits-/Synchronisationsabfrage alle 30 Sekunden.
 * Der sichtbare Status kommt primär direkt vom Live-Refresh.
 */
var ELKOS_SNAPSHOT_INTERVAL =
  30000;


/*
 * Echten ELKOS-Liveabruf anstoßen:
 * alle 3 Sekunden. CALL/BUSY/NORMAL werden direkt aus
 * dieser Antwort übernommen – ohne auf den Snapshot zu warten.
 */
var ELKOS_REFRESH_INTERVAL =
  3000;


/*
 * Ein hängender Live-Refresh darf die Anzeige nicht blockieren.
 * Nach 8 Sekunden darf ein neuer Refresh versucht werden.
 */
var ELKOS_REFRESH_TIMEOUT =
  8000;


/*
 * Snapshot-/Meta-Endpunkte sollten schnell antworten.
 */
var FAST_REQUEST_TIMEOUT =
  5000;


/*
 * Nur wenn das Apps-Script-Backend 5 Minuten lang
 * gar nicht antwortet, wird der lokale Fallback angezeigt.
 *
 * WICHTIG:
 * Ein reiner ELKOS-Ausfall löst KEINEN großen Fallback aus.
 */
var BACKEND_FALLBACK_MS =
  5 * 60 * 1000;


/*
 * ELKOS-Daten dürfen maximal 30 Sekunden alt sein.
 * Danach wird CALL/BUSY/NORMAL als nicht mehr sicher aktuell
 * verworfen und das normale Disponentenbild gezeigt.
 *
 * WICHTIG:
 * Das löst KEINEN großen Verbindungs-Fallback aus.
 */
var ELKOS_DATA_MAX_AGE_MS =
  30 * 1000;


/*
 * CALL/BUSY nach 30 Minuten unverändert:
 * normales Disponentenbild zeigen.
 */
var ELKOS_STUCK_30_MIN =
  30 * 60 * 1000;


/* =========================================================
   ELEMENTE
   ========================================================= */

var img =
  document.getElementById("schild");

var meldung =
  document.getElementById("meldung");

var statusOverlay =
  document.getElementById("statusOverlay");

var statusTitle =
  document.getElementById("statusTitle");

var statusSubtitle =
  document.getElementById("statusSubtitle");

var debugPanel =
  document.getElementById("debugPanel");


/* =========================================================
   STATUSVARIABLEN
   ========================================================= */

var currentUrl =
  "";


/*
 * Letzter erfolgreicher Kontakt zum Apps-Script-Backend.
 * JEDER schnelle Snapshot-/Meta-Erfolg zählt.
 */
var pageStartedAt =
  Date.now();

var lastSuccess =
  0;


/*
 * Zeitpunkt des letzten echten, gültigen ELKOS-Live-Snapshots.
 * Wird NICHT bei jedem Lesen des gleichen Snapshots erneuert.
 */
var lastElkosSuccess =
  0;


var lastAppliedSnapshotTs =
  0;


var lastKnownDisponentName =
  "";

try {

  lastKnownDisponentName =
    localStorage.getItem(
      "bazLastKnownDisponentName"
    ) || "";

} catch (e) {}


/*
 * Letztes erfolgreiches Disponentenbild lokal merken.
 * Dadurch bleibt das wichtigste Element – Name/Bild des
 * diensthabenden Disponenten – auch bei einem kurzen
 * Apps-Script-Aussetzer sofort sichtbar.
 */
var lastKnownImageUrl =
  "";

try {

  lastKnownImageUrl =
    localStorage.getItem(
      "bazLastKnownImageUrl"
    ) || "";

} catch (e) {}


if (
  lastKnownImageUrl
) {

  currentUrl =
    lastKnownImageUrl;

  img.src =
    currentUrl +
    (
      currentUrl.indexOf("?") >= 0
        ? "&"
        : "?"
    ) +
    "startup=" +
    Date.now();
}


var globalFallbackActive =
  false;

var globalFallbackTrueCount =
  0;

var localFallbackActive =
  false;

var offlineTestMode =
  false;

var elkosEnabled =
  true;

var currentBazStatus =
  "UNKNOWN";

/*
 * Letzte technische ELKOS-Diagnose.
 * Wird nur im ?debug=1 Panel angezeigt.
 */
var lastElkosDiagnostic =
  "";

var lastRefreshDurationMs =
  0;

var lastAuthDurationMs =
  0;

var lastElkosApiDurationMs =
  0;

var metaRequestRunning =
  false;

var snapshotRequestRunning =
  false;

var refreshRequestRunning =
  false;

var debugMode =
  false;

var uiTestMode =
  "";


/* =========================================================
   URL PARAMETER
   ========================================================= */

var params =
  new URLSearchParams(
    window.location.search
  );


if (
  params.has("debug") ||
  params.get("debug") === "1"
) {

  debugMode =
    true;

  debugPanel.style.display =
    "block";
}


var requestedTest =
  String(
    params.get("test") || ""
  ).toLowerCase();


if (
  requestedTest === "call" ||
  requestedTest === "busy" ||
  requestedTest === "normal"
) {

  uiTestMode =
    requestedTest;
}


if (
  params.has("offline") ||
  params.has("testoffline") ||
  params.get("test") === "offline"
) {

  offlineTestMode =
    true;

  globalFallbackActive =
    true;
}


/* =========================================================
   DEBUG
   ========================================================= */

function setDebug(text) {

  if (!debugMode) {

    return;
  }


  debugPanel.style.display =
    "block";

  debugPanel.innerHTML =
    text;
}


/* =========================================================
   STATUS OVERLAY
   ========================================================= */

function hideStatusOverlay() {

  statusOverlay.className =
    "";

  statusOverlay.style.display =
    "none";

  statusTitle.innerHTML =
    "";

  statusSubtitle.innerHTML =
    "";
}


function showCallStatus() {

  statusOverlay.className =
    "call";

  statusOverlay.style.display =
    "flex";

  statusTitle.innerHTML =
    "DISPONENT<br>IM NOTRUFGESPRÄCH";

  statusSubtitle.innerHTML =
    "BITTE WARTEN";
}


function showBusyStatus() {

  statusOverlay.className =
    "busy";

  statusOverlay.style.display =
    "flex";

  statusTitle.innerHTML =
    "DISPONENT KURZ ABWESEND";

  statusSubtitle.innerHTML =
    "BITTE WARTEN";
}


/* =========================================================
   UI TEST
   ========================================================= */

function applyUiTestMode() {

  if (
    uiTestMode === "call"
  ) {

    showCallStatus();

    return true;
  }


  if (
    uiTestMode === "busy"
  ) {

    showBusyStatus();

    return true;
  }


  if (
    uiTestMode === "normal"
  ) {

    hideStatusOverlay();

    return true;
  }


  return false;
}


/* =========================================================
   FALLBACK
   ========================================================= */

function getFallbackReason() {

  /*
   * Globaler Fallback bleibt bewusst erhalten.
   */
  if (
    globalFallbackActive === true
  ) {

    return "GLOBAL";
  }


  var now =
    Date.now();


  /*
   * Nur ein echter Backend-Ausfall darf den großen
   * Verbindungs-Fallback einschalten.
   *
   * ELKOS ist davon absichtlich entkoppelt.
   */
  var backendReferenceTs =
    lastSuccess > 0
      ? lastSuccess
      : pageStartedAt;


  if (
    now -
    backendReferenceTs >=
      BACKEND_FALLBACK_MS
  ) {

    return "BACKEND";
  }


  return "";
}


function showFallback(
  reason
) {

  var meldungText =
    document.getElementById(
      "meldungText"
    );


  var nameText =
    lastKnownDisponentName
      ? lastKnownDisponentName
      : "derzeit nicht verfügbar";


  if (
    reason === "GLOBAL"
  ) {

    meldungText.innerHTML =
      "Das digitale Türschild befindet sich derzeit im Fallback-Modus.<br><br>" +
      "<strong>Diensthabender Disponent:</strong><br>" +
      "<span style='font-size:1.4em;font-weight:700;'>" +
      nameText +
      "</span><br><br>" +
      "Bitte läuten Sie einfach an.";

  } else if (
    reason === "BACKEND"
  ) {

    meldungText.innerHTML =
      "Derzeit gibt es Verbindungsschwierigkeiten.<br>" +
      "Die Verbindung zum Türschild-Server ist derzeit unterbrochen.<br><br>" +
      "<strong>Diensthabender Disponent:</strong><br>" +
      "<span style='font-size:1.4em;font-weight:700;'>" +
      nameText +
      "</span><br><br>" +
      "Bitte läuten Sie einfach an.";

  } else {

    /*
     * Sicherheitsnetz für unbekannte zukünftige Gründe.
     * ELKOS selbst kommt hier NICHT mehr hinein.
     */
    meldungText.innerHTML =
      "Derzeit gibt es Verbindungsschwierigkeiten.<br><br>" +
      "<strong>Diensthabender Disponent:</strong><br>" +
      "<span style='font-size:1.4em;font-weight:700;'>" +
      nameText +
      "</span><br><br>" +
      "Bitte läuten Sie einfach an.";
  }


  meldung.style.display =
    "flex";
}


function hideFallback() {

  if (
    globalFallbackActive ||
    localFallbackActive
  ) {

    return;
  }


  meldung.style.display =
    "none";
}


function enforceElkosFreshness() {

  if (
    elkosEnabled !== true
  ) {

    return;
  }


  var fresh =
    (
      lastElkosSuccess > 0 &&
      Date.now() -
        lastElkosSuccess <
        ELKOS_DATA_MAX_AGE_MS
    );


  if (
    !fresh
  ) {

    /*
     * Kein bestätigter ELKOS-Live-Status innerhalb von 30 s:
     * alten CALL/BUSY/NORMAL nicht weiter als aktuell ausgeben.
     */
    currentBazStatus =
      "UNKNOWN";

    hideStatusOverlay();
  }
}


function checkFallback() {

  /*
   * ELKOS-Frische unabhängig vom großen Fallback überwachen.
   * Dadurch kann ein alter CALL/BUSY auch dann nicht hängen bleiben,
   * wenn gerade Snapshot-Requests ausfallen.
   */
  enforceElkosFreshness();


  var reason =
    getFallbackReason();


  localFallbackActive =
    (
      reason === "BACKEND"
    );


  if (
    reason
  ) {

    showFallback(
      reason
    );

  } else {

    hideFallback();
  }


  if (debugMode) {

    setDebug(

      "<b>BAZ Türschild – Snapshot-Modus</b>" +

      "<br><br>Disponent: " +
      (
        lastKnownDisponentName ||
        "-"
      ) +

      "<br>BAZ Status: " +
      (
        currentBazStatus ||
        "-"
      ) +

      "<br>ELKOS aktiviert: " +
      String(
        elkosEnabled
      ) +

      "<br>Backend letzte Antwort vor: " +
      (
        lastSuccess > 0
          ? (
              Math.round(
                (
                  Date.now() -
                  lastSuccess
                ) /
                1000
              ) +
              " s"
            )
          : "NOCH KEINE ANTWORT"
      ) +

      "<br>ELKOS letzter bestätigter Live-Status vor: " +
      (
        lastElkosSuccess > 0
          ? (
              Math.round(
                (
                  Date.now() -
                  lastElkosSuccess
                ) /
                1000
              ) +
              " s"
            )
          : "NOCH KEINER"
      ) +

      "<br>ELKOS Daten: " +
      (
        !elkosEnabled
          ? "DEAKTIVIERT"
          : (
              lastElkosSuccess <= 0
                ? "NOCH KEIN GÜLTIGER LIVE-STATUS"
                : (
                    Date.now() -
                    lastElkosSuccess <
                      ELKOS_DATA_MAX_AGE_MS
                      ? "AKTUELL (max. 30 s)"
                      : "VERALTET (>30 s) – normales Bild bleibt aktiv"
                  )
            )
      ) +

      "<br>ELKOS Diagnose: " +
      (
        lastElkosDiagnostic ||
        "OK"
      ) +

      "<br>Letzter Live-Refresh gesamt: " +
      (
        lastRefreshDurationMs > 0
          ? lastRefreshDurationMs + " ms"
          : "-"
      ) +

      "<br>Authentifizierung/Token: " +
      (
        lastAuthDurationMs > 0
          ? lastAuthDurationMs + " ms"
          : "-"
      ) +

      "<br>ELKOS API: " +
      (
        lastElkosApiDurationMs > 0
          ? lastElkosApiDurationMs + " ms"
          : "-"
      ) +

      "<br>Fallback: " +
      (
        reason ||
        "AUS"
      ) +

      "<br>Refresh läuft: " +
      String(
        refreshRequestRunning
      )
    );
  }
}


/* =========================================================
   30-MINUTEN-HÄNGER ERKENNEN
   ========================================================= */

function elkosStatusHaengt30Minuten(
  data,
  status
) {

  if (
    !data ||
    !Array.isArray(
      data.bazArbeitsplaetze
    )
  ) {

    return false;
  }


  var rawStatus =
    "";


  if (
    status === "CALL"
  ) {

    rawStatus =
      "BESCHAEFTIGT";

  } else if (
    status === "BUSY"
  ) {

    rawStatus =
      "PAUSE";

  } else {

    return false;
  }


  var zeiten =
    data.bazArbeitsplaetze

      .filter(
        function(ap) {

          return String(
            ap.verfuegbarkeit ||
            ""
          ).toUpperCase() ===
            rawStatus;
        }
      )

      .map(
        function(ap) {

          return Date.parse(
            ap.letzteAenderung ||
            ""
          );
        }
      )

      .filter(
        function(ts) {

          return Number.isFinite(
            ts
          );
        }
      );


  if (
    zeiten.length === 0
  ) {

    return false;
  }


  var letzteAenderung =
    Math.max.apply(
      null,
      zeiten
    );


  return (
    Date.now() -
    letzteAenderung
  ) >=
    ELKOS_STUCK_30_MIN;
}


/* =========================================================
   ELKOS STATUS ANZEIGEN
   ========================================================= */

function applyBazStatus(
  data
) {

  if (
    applyUiTestMode()
  ) {

    return;
  }


  elkosEnabled =
    !!(
      data &&
      data.bazStatusEnabled === true
    );


  if (
    !elkosEnabled
  ) {

    currentBazStatus =
      "DISABLED";

    hideStatusOverlay();

    return;
  }


  if (
    !data ||
    data.bazStatusOk !== true
  ) {

    /*
     * Ein technischer Fehler verändert die sichtbare
     * Anzeige NICHT. Der letzte gültige Zustand bleibt.
     */
    return;
  }


  var status =
    String(
      data.bazStatus ||
      "UNKNOWN"
    ).toUpperCase();


  if (
    status === "UNKNOWN"
  ) {

    return;
  }


  currentBazStatus =
    status;


  /*
   * Sicherheitsfallback:
   * CALL/BUSY seit >= 30 Minuten unverändert.
   */
  if (
    (
      status === "CALL" ||
      status === "BUSY"
    ) &&
    elkosStatusHaengt30Minuten(
      data,
      status
    )
  ) {

    hideStatusOverlay();

    return;
  }


  if (
    status === "CALL"
  ) {

    showCallStatus();

    return;
  }


  if (
    status === "BUSY"
  ) {

    showBusyStatus();

    return;
  }


  if (
    status === "NORMAL" ||
    status === "OFFLINE"
  ) {

    hideStatusOverlay();
  }
}


/* =========================================================
   HILFE: JSONP SCRIPT AUFRUF
   ========================================================= */

function makeJsonpRequest(
  url,
  callbackPrefix,
  timeoutMs,
  onSuccess,
  onTimeout
) {

  var callbackName =
    callbackPrefix +
    "_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  var responded =
    false;


  var script =
    document.createElement(
      "script"
    );


  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    } catch (e) {}


    if (
      script &&
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );
    }
  }


  window[
    callbackName
  ] =
    function(data) {

      if (
        responded
      ) {

        return;
      }


      responded =
        true;


      try {

        onSuccess(
          data
        );

      } finally {

        cleanup();
      }
    };


  script.onerror =
    function() {

      if (
        responded
      ) {

        return;
      }


      responded =
        true;


      cleanup();


      if (
        typeof onTimeout ===
        "function"
      ) {

        onTimeout();
      }
    };


  script.src =

    url +

    (
      url.indexOf("?") >= 0
        ? "&"
        : "?"
    ) +

    "callback=" +
    encodeURIComponent(
      callbackName
    ) +

    "&t=" +
    Date.now();


  document.body
    .appendChild(
      script
    );


  setTimeout(
    function() {

      if (
        responded
      ) {

        return;
      }


      responded =
        true;


      cleanup();


      if (
        typeof onTimeout ===
        "function"
      ) {

        onTimeout();
      }

    },
    timeoutMs
  );
}


/* =========================================================
   BILD / DISPONENT
   ========================================================= */

function requestMeta() {

  if (
    metaRequestRunning ||
    globalFallbackActive
  ) {

    return;
  }


  metaRequestRunning =
    true;


  var cb =
    "schildmeta_cb_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  var responded =
    false;


  var script =
    document.createElement(
      "script"
    );


  function cleanupMeta() {

    try {
      delete window[cb];
    } catch (e) {}


    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );
    }
  }


  window[cb] =
    function(data) {

      if (responded) {
        return;
      }


      responded =
        true;


      metaRequestRunning =
        false;


      if (
        data &&
        data.ok === true &&
        data.url
      ) {

        lastSuccess =
          Date.now();


        if (data.name) {

          lastKnownDisponentName =
            String(
              data.name
            );

          try {

            localStorage.setItem(
              "bazLastKnownDisponentName",
              lastKnownDisponentName
            );

          } catch (e) {}
        }


        var neueUrl =
          String(
            data.url
          );


        /*
         * Letztes gültiges Bild lokal sichern.
         * Das Dashboard/Apps Script bleibt die Datenquelle;
         * localStorage ist nur die Anzeige-Ausfallsicherung.
         */
        try {

          localStorage.setItem(
            "bazLastKnownImageUrl",
            neueUrl
          );

          lastKnownImageUrl =
            neueUrl;

        } catch (e) {}


        /*
         * Bild beim ersten erfolgreichen META-Aufruf
         * IMMER setzen. Danach nur bei Änderung oder wenn
         * das img-Element noch keine Quelle hat.
         */
        if (
          neueUrl !== currentUrl ||
          !img.getAttribute("src")
        ) {

          currentUrl =
            neueUrl;


          img.src =
            currentUrl +
            (
              currentUrl.indexOf("?") >= 0
                ? "&"
                : "?"
            ) +
            "r=" +
            Date.now();
        }


        checkFallback();

      } else {

        checkFallback();
      }


      cleanupMeta();
    };


  script.onerror =
    function() {

      if (responded) {
        return;
      }


      responded =
        true;


      metaRequestRunning =
        false;


      cleanupMeta();


      checkFallback();
    };


  script.src =
    SCRIPT_URL +
    "?schildmeta=1" +
    "&callback=" +
    encodeURIComponent(cb) +
    "&t=" +
    Date.now();


  document.body.appendChild(
    script
  );


  setTimeout(
    function() {

      if (responded) {
        return;
      }


      responded =
        true;


      metaRequestRunning =
        false;


      cleanupMeta();


      checkFallback();

    },
    FAST_REQUEST_TIMEOUT
  );
}


/* =========================================================
   ELKOS SNAPSHOT LESEN
   ========================================================= */

function requestElkosSnapshot() {

  if (
    snapshotRequestRunning ||
    globalFallbackActive
  ) {

    return;
  }


  snapshotRequestRunning =
    true;


  makeJsonpRequest(

    SCRIPT_URL +
      "?elkossnapshot=1",

    "elkossnapshot",

    FAST_REQUEST_TIMEOUT,

    function(data) {

      snapshotRequestRunning =
        false;


      /*
       * Der schnelle Snapshot-Endpunkt hat geantwortet:
       * Backend ist erreichbar – unabhängig davon,
       * ob ELKOS selbst gerade funktioniert.
       */
      lastSuccess =
        Date.now();


      if (
        !data ||
        data.ok !== true
      ) {

        checkFallback();

        return;
      }


      elkosEnabled =
        data.bazStatusEnabled === true;


      if (
        data.bazDiagnostic &&
        data.bazDiagnostic.message
      ) {

        lastElkosDiagnostic =
          String(
            data.bazDiagnostic.message
          );
      }


      if (
        !elkosEnabled
      ) {

        currentBazStatus =
          "DISABLED";

        lastElkosSuccess =
          0;

        lastElkosDiagnostic =
          "";

        hideStatusOverlay();

        checkFallback();

        return;
      }


      var savedAt =
        Number(
          data.bazSnapshotSavedAt ||
          0
        );


      /*
       * Zeitpunkt des letzten ECHTEN erfolgreichen
       * ELKOS-Liveabrufs übernehmen.
       */
      if (
        savedAt > 0
      ) {

        lastElkosSuccess =
          savedAt;
      }


      var snapshotFresh =
        (
          data.bazStatusOk === true &&
          savedAt > 0 &&
          Date.now() -
            savedAt <
            ELKOS_DATA_MAX_AGE_MS
        );


      if (
        snapshotFresh
      ) {

        /*
         * Ein frischer Snapshot ist wieder da.
         * Eine alte technische Fehlermeldung darf verschwinden,
         * sofern das Backend keine neue Diagnose mitsendet.
         */
        if (
          !data.bazDiagnostic ||
          !data.bazDiagnostic.message
        ) {

          lastElkosDiagnostic =
            "";
        }


        if (
          savedAt >
            lastAppliedSnapshotTs ||
          currentBazStatus !==
            String(
              data.bazStatus ||
              "UNKNOWN"
            ).toUpperCase()
        ) {

          lastAppliedSnapshotTs =
            savedAt;


          applyBazStatus(
            data
          );
        }

      } else {

        /*
         * WICHTIG:
         * ELKOS ist nicht aktuell -> KEIN großer Fallback.
         * Eine eventuell alte CALL/BUSY-Anzeige wird entfernt,
         * damit immer das normale Disponentenbild sichtbar bleibt.
         */
        currentBazStatus =
          "UNKNOWN";

        hideStatusOverlay();


        if (
          !lastElkosDiagnostic
        ) {

          if (
            savedAt > 0
          ) {

            lastElkosDiagnostic =
              "ELKOS Snapshot seit " +
              Math.round(
                (
                  Date.now() -
                  savedAt
                ) /
                1000
              ) +
              " s nicht aktualisiert";

          } else {

            lastElkosDiagnostic =
              String(
                data.bazStatusMessage ||
                "Noch kein gültiger ELKOS Snapshot vorhanden"
              );
          }
        }
      }


      checkFallback();
    },

    function() {

      snapshotRequestRunning =
        false;

      /*
       * Ein einzelner Snapshot-Timeout löst keinen Fallback aus.
       * Erst wenn das Backend insgesamt BACKEND_FALLBACK_MS
       * nicht mehr antwortet, greift BACKEND.
       */
      checkFallback();
    }
  );
}

/* =========================================================
   ELKOS LIVE REFRESH
   ========================================================= */

function requestElkosRefresh() {

  if (
    refreshRequestRunning ||
    globalFallbackActive
  ) {

    return;
  }


  refreshRequestRunning =
    true;


  makeJsonpRequest(

    SCRIPT_URL +
      "?elkosrefresh=1",

    "elkosrefresh",

    ELKOS_REFRESH_TIMEOUT,

    function(data) {

      refreshRequestRunning =
        false;


      /*
       * Apps Script hat geantwortet -> Backend lebt.
       * Das gilt auch dann, wenn ELKOS selbst gerade fehlschlägt.
       */
      lastSuccess =
        Date.now();


      if (data) {

        lastRefreshDurationMs =
          Number(
            data.durationMs ||
            0
          );

        if (data.bazTiming) {

          lastAuthDurationMs =
            Number(
              data.bazTiming.authMs ||
              0
            );

          lastElkosApiDurationMs =
            Number(
              data.bazTiming.elkosMs ||
              0
            );
        }
      }


      if (
        data &&
        data.refreshOk === true
      ) {

        lastElkosDiagnostic =
          "";


        /*
         * DAS ist ein bestätigter erfolgreicher ELKOS-Liveabruf.
         * Den Status sofort übernehmen – nicht erst auf den nächsten
         * Snapshot-Request warten.
         */
        var liveTs =
          Number(
            data.bazUpdatedTs ||
            Date.now()
          );

        lastElkosSuccess =
          liveTs;

        lastAppliedSnapshotTs =
          Math.max(
            lastAppliedSnapshotTs,
            liveTs
          );

        applyBazStatus(
          data
        );


        /*
         * Danach Snapshot lesen, damit auch die vollständigen
         * Arbeitsplatzdaten/Zeiten synchron bleiben.
         */
        requestElkosSnapshot();

      } else if (
        data
      ) {

        if (
          data.bazDiagnostic &&
          data.bazDiagnostic.message
        ) {

          lastElkosDiagnostic =
            String(
              data.bazDiagnostic.message
            );

        } else {

          lastElkosDiagnostic =
            String(
              data.bazStatusMessage ||
              "ELKOS Live-Refresh nicht erfolgreich"
            );
        }
      }


      checkFallback();
    },

    function() {

      refreshRequestRunning =
        false;

      lastElkosDiagnostic =
        "ELKOS Live-Refresh: Timeout oder Netzwerkfehler";

      /*
       * KEIN großer Fallback wegen ELKOS.
       * Das normale Türschild bleibt bestehen.
       */
      checkFallback();
    }
  );
}

/* =========================================================
   BILDFEHLER
   ========================================================= */

img.onerror =
  function() {

    /*
     * Ein einzelner Bildfehler löst keinen sofortigen
     * Fallback aus.
     */
    checkFallback();
  };


/* =========================================================
   GLOBALER FALLBACK
   ========================================================= */

async function checkGlobalFallbackStatus() {

  if (
    offlineTestMode
  ) {

    globalFallbackActive =
      true;

    checkFallback();

    return;
  }


  var url =

    GLOBAL_STATUS_URL +

    "?nocache=" +

    Date.now();


  try {

    var response =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    var text =
      await response.text();


    var fallbackIsTrue =
      false;


    try {

      var data =
        JSON.parse(
          text
        );


      fallbackIsTrue =
        !!(
          data &&
          data.fallback === true
        );


    } catch (jsonErr) {

      fallbackIsTrue =
        /["']?fallback["']?\s*:\s*true/i
          .test(
            text
          );
    }


    if (
      fallbackIsTrue
    ) {

      globalFallbackTrueCount++;


      if (
        globalFallbackTrueCount >=
          2
      ) {

        globalFallbackActive =
          true;
      }


    } else {

      var warAktiv =
        globalFallbackActive;


      globalFallbackTrueCount =
        0;


      globalFallbackActive =
        false;


      /*
       * Nach Ende eines globalen Fallbacks
       * sofort aktuelle Daten nachholen.
       */
      if (
        warAktiv
      ) {

        requestMeta();

        requestElkosSnapshot();

        requestElkosRefresh();
      }
    }


    checkFallback();


  } catch (err) {

    /*
     * Fehler der globalen Statusdatei allein
     * aktiviert KEINEN Fallback.
     */

    console.log(
      "Globaler Status konnte nicht geprüft werden:",
      err
    );
  }
}


/* =========================================================
   START
   ========================================================= */

hideStatusOverlay();


if (
  offlineTestMode
) {

  showFallback(
    "GLOBAL"
  );
}


applyUiTestMode();


/*
 * Bild/Name sofort laden.
 */
requestMeta();


/*
 * Zuerst vorhandenen Snapshot sofort anzeigen.
 */
requestElkosSnapshot();


/*
 * Danach echten Live-Refresh im Hintergrund anstoßen.
 */
requestElkosRefresh();


/*
 * Globalen Status prüfen.
 */
checkGlobalFallbackStatus();


/* =========================================================
   TIMER
   ========================================================= */

/*
 * Bild / Disponent
 */
setInterval(
  requestMeta,
  META_UPDATE_INTERVAL
);


/*
 * Snapshot lesen.
 * Das ist KEIN ELKOS-Liveabruf.
 */
setInterval(
  requestElkosSnapshot,
  ELKOS_SNAPSHOT_INTERVAL
);


/*
 * ELKOS live im Hintergrund aktualisieren.
 */
setInterval(
  requestElkosRefresh,
  ELKOS_REFRESH_INTERVAL
);


/*
 * Lokalen Fallback regelmäßig prüfen.
 */
setInterval(
  checkFallback,
  1000
);


/*
 * Globaler Fallback.
 */
setInterval(
  checkGlobalFallbackStatus,
  10000
);

console.log(
  "✅ BAZ Türschild Snapshot-Modus geladen."
);

</script>
